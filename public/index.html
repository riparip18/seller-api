<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Seller API Control</title>
    
    <!-- Pin exact CDN versions: an unpinned @babel/standalone jumped to v8 and broke the page (blank screen). -->
    <!-- Ant Design CSS (v5 is CSS-in-JS; reset.css is the only stylesheet it ships) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/reset.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Day.js required by Ant Design UMD -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
    <!-- Ant Design JS -->
    <script src="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/antd.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0,0,0,0.1);
        }
        .big-button {
            height: 72px;
            min-width: 280px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
        }
        .hint {
            margin-top: 16px;
            color: #666;
        }
        .log-panel {
            width: min(1100px, calc(100vw - 120px));
            text-align: left;
        }
        .log-path {
            font-family: SFMono-Regular, Consolas, 'Liberation Mono', monospace;
            font-size: 12px;
        }
        .log-json {
            margin: 4px 0 12px;
            padding: 8px 12px;
            max-height: 260px;
            overflow: auto;
            background: #f6f8fa;
            border-radius: 6px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useRef } = React;
        const { Button, Typography, message, DatePicker, Card, Statistic, Space, Tabs, Radio, Select, Table, Spin, Divider, Switch, Tag } = antd;
        const { Text, Title } = Typography;

        // ===== Log API: incoming /webhook + /api/* hits and outgoing VCG calls (local server.js only) =====
        const LOG_POLL_MS = 3000;
        const MAX_LOG_ROWS = 200;

        // VCG replies HTTP 200 even on failure; a status_code other than '00' is the real error.
        const isVcgError = (code) => code != null && code !== '00';

        const statusColor = (status, code) => {
            if (status == null || status >= 500) return 'red';
            if (status >= 400 || isVcgError(code)) return 'orange';
            return 'green';
        };

        const renderStatus = (status, entry) => (
            <Tag color={statusColor(status, entry.code)} title={isVcgError(entry.code) ? `VCG status_code ${entry.code}` : undefined}>
                {status ?? 'ERR'}{isVcgError(entry.code) ? ` · ${entry.code}` : ''}
            </Tag>
        );

        const LogJson = ({ label, value }) => value == null ? null : (
            <div>
                <Text strong>{label}</Text>
                <pre className="log-json">{typeof value === 'string' ? value : JSON.stringify(value, null, 2)}</pre>
            </div>
        );

        const LOG_COLUMNS = [
            { title: 'Waktu', dataIndex: 'ts', key: 'ts', width: 90, render: (ts) => dayjs(ts).format('HH:mm:ss') },
            { title: 'Arah', dataIndex: 'direction', key: 'direction', width: 70, render: (d) => d === 'in' ? <Tag color="blue">IN</Tag> : <Tag color="purple">OUT</Tag> },
            { title: 'Method', dataIndex: 'method', key: 'method', width: 80 },
            { title: 'Path', dataIndex: 'path', key: 'path', ellipsis: true, render: (p) => <span className="log-path" title={p}>{p}</span> },
            { title: 'Status', dataIndex: 'status', key: 'status', width: 100, render: renderStatus },
            { title: 'Durasi', dataIndex: 'durationMs', key: 'durationMs', width: 90, align: 'right', render: (ms) => ms == null ? '-' : `${ms} ms` },
        ];

        const renderLogDetail = (entry) => (
            <div>
                {entry.error ? <div style={{ marginBottom: 8 }}><Text type="danger">{entry.error}</Text></div> : null}
                <LogJson label="Params" value={entry.params} />
                <LogJson label="Request" value={entry.request} />
                <LogJson label="Response" value={entry.response} />
                {entry.params == null && entry.request == null && entry.response == null && !entry.error
                    ? <Text type="secondary">Tidak ada payload</Text> : null}
            </div>
        );

        const MAX_POLL_FAILURES = 3;

        const loadLogs = async (since) => {
            const res = await fetch(`/api/logs?since=${since}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.error);
            return data.data || {};
        };

        function ApiLogPanel({ active }) {
            const [logs, setLogs] = useState([]);
            const [direction, setDirection] = useState('all'); // 'all' | 'in' | 'out'
            const [autoRefresh, setAutoRefresh] = useState(true);
            const lastIdRef = useRef(0);
            const epochRef = useRef(null); // server process the rows came from
            const generationRef = useRef(0); // bumped by Clear so in-flight results are dropped
            const inFlightRef = useRef(false);
            const failuresRef = useRef(0);

            const fetchLogs = async () => {
                if (inFlightRef.current) return;
                inFlightRef.current = true;
                const generation = generationRef.current;
                try {
                    let page = await loadLogs(lastIdRef.current);
                    // Server restarted: its ids start over, so reload everything from the new process.
                    const restarted = epochRef.current !== null && page.epoch !== epochRef.current;
                    if (restarted) page = await loadLogs(0);
                    if (generation !== generationRef.current) return;
                    epochRef.current = page.epoch;
                    lastIdRef.current = page.last_id ?? 0;
                    const items = page.items || [];
                    setLogs((prev) => {
                        const kept = restarted ? [] : prev;
                        const newest = kept[0]?.id ?? 0;
                        return [...items.filter((e) => e.id > newest), ...kept].slice(0, MAX_LOG_ROWS);
                    });
                    failuresRef.current = 0;
                } catch (_) {
                    failuresRef.current += 1;
                    if (failuresRef.current === 1) message.error('Gagal mengambil log API (hanya tersedia di server lokal)');
                    // A server restart recovers on the next poll; stop only when it keeps failing.
                    if (failuresRef.current >= MAX_POLL_FAILURES) setAutoRefresh(false);
                } finally {
                    inFlightRef.current = false;
                }
            };

            const clearLogs = async () => {
                try {
                    const res = await fetch('/api/logs/clear', { method: 'POST' });
                    const data = await res.json();
                    if (!data.success) throw new Error(data.message || data.error);
                    generationRef.current += 1;
                    lastIdRef.current = data.data?.last_id ?? lastIdRef.current;
                    epochRef.current = data.data?.epoch ?? epochRef.current;
                    setLogs([]);
                } catch (_) {
                    message.error('Gagal menghapus log');
                }
            };

            useEffect(() => { if (active) fetchLogs(); }, [active]);
            useEffect(() => {
                if (!active || !autoRefresh) return undefined;
                failuresRef.current = 0;
                const timer = setInterval(fetchLogs, LOG_POLL_MS);
                return () => clearInterval(timer);
            }, [active, autoRefresh]);

            const visible = direction === 'all' ? logs : logs.filter((e) => e.direction === direction);

            return (
                <div className="log-panel">
                    <Space wrap style={{ marginBottom: 8 }}>
                        <Radio.Group value={direction} onChange={(e) => setDirection(e.target.value)}>
                            <Radio.Button value="all">Semua</Radio.Button>
                            <Radio.Button value="in">Masuk</Radio.Button>
                            <Radio.Button value="out">Keluar (VCG)</Radio.Button>
                        </Radio.Group>
                        <Space size={6}>
                            <Switch size="small" checked={autoRefresh} onChange={setAutoRefresh} data-testid="log-auto-refresh" />
                            <Text>Auto refresh</Text>
                        </Space>
                        <Button onClick={fetchLogs} data-testid="log-refresh">Refresh</Button>
                        <Button danger onClick={clearLogs} data-testid="log-clear">Clear</Button>
                    </Space>
                    <div style={{ marginBottom: 12 }}>
                        <Text type="secondary">
                            Hit masuk (/webhook, /api/*) dan call keluar ke VCG API. Disimpan di memory server lokal (maks {MAX_LOG_ROWS}), hilang saat server restart.
                        </Text>
                    </div>
                    <Table
                        rowKey="id"
                        size="small"
                        dataSource={visible}
                        columns={LOG_COLUMNS}
                        expandable={{ expandedRowRender: renderLogDetail }}
                        pagination={{ pageSize: 20, showSizeChanger: false }}
                        scroll={{ x: 700 }}
                        locale={{ emptyText: 'Belum ada hit API' }}
                    />
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('control');
            const [running, setRunning] = useState(false);
            const [loading, setLoading] = useState(false);
            const [urls, setUrls] = useState({ webhook_url: '', status_url: '' });
            const [controlsEnabled, setControlsEnabled] = useState(false);
            const [summaryLoading, setSummaryLoading] = useState(false);
            const [summary, setSummary] = useState({ pendapatan: 0, potongan: 0, laba_bersih: 0 });
            const [range, setRange] = useState([dayjs().startOf('month'), dayjs().endOf('month')]);
            const [source, setSource] = useState('transactions'); // 'transactions' | 'balance'

            const fetchStatus = async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    if (data.success) {
                        setRunning(Boolean(data.data?.tunnel_running));
                        setControlsEnabled(Boolean(data.data?.controls_enabled));
                        setUrls({
                            webhook_url: data.data?.webhook_url || '',
                            status_url: data.data?.status_url || ''
                        });
                    }
                } catch (_) {
                    message.error('Gagal mengambil status');
                }
            };

            const toggle = async () => {
                setLoading(true);
                try {
                    const endpoint = running ? '/api/stop' : '/api/start';
                    const res = await fetch(endpoint, { method: 'POST' });
                    const data = await res.json();
                    if (!data.success) {
                        message.error(data.message || 'Aksi gagal');
                    }
                } catch (_) {
                    message.error('Koneksi gagal');
                } finally {
                    await fetchStatus();
                    setLoading(false);
                }
            };

            useEffect(() => { fetchStatus(); }, []);

            const fetchSummary = async () => {
                setSummaryLoading(true);
                try {
                    let endpoint = '/api/transactions/summary';
                    const [start, end] = range || [];
                    const params = new URLSearchParams();
                    if (source === 'transactions') {
                        if (start) params.set('date_start', start.format('YYYY-MM-DD'));
                        if (end) params.set('date_end', end.format('YYYY-MM-DD'));
                    } else {
                        // Balance histories doesn't support date range directly; allow search keyword if needed
                    }
                    if (source === 'balance') endpoint = '/api/balance/summary';
                    const res = await fetch(`${endpoint}?${params.toString()}`);
                    const data = await res.json();
                    if (data.success) {
                        setSummary(data.data || { pendapatan: 0, potongan: 0, laba_bersih: 0 });
                    } else {
                        message.error('Gagal mengambil ringkasan');
                    }
                } catch (_) {
                    message.error('Koneksi gagal');
                } finally {
                    setSummaryLoading(false);
                }
            };

            // ===== Product discovery state =====
            const [categories, setCategories] = useState([]);
            const [brands, setBrands] = useState([]);
            const [groups, setGroups] = useState([]);
            const [variations, setVariations] = useState([]);
            const [catId, setCatId] = useState(undefined);
            const [brandId, setBrandId] = useState(undefined);
            const [groupId, setGroupId] = useState(undefined);
            const [prodLoading, setProdLoading] = useState(false);

            const getJSON = async (url) => {
                const res = await fetch(url);
                return res.json();
            };

            const loadCategories = async () => {
                setProdLoading(true);
                try {
                    const data = await getJSON('/api/product/categories');
                    if (data.success) setCategories(data.data || []); else message.error('Gagal ambil kategori');
                } catch (_) { message.error('Koneksi gagal'); }
                finally { setProdLoading(false); }
            };
            const loadBrands = async (category_id) => {
                if (!category_id) return;
                setProdLoading(true);
                try {
                    const data = await getJSON(`/api/product/brands?category_id=${encodeURIComponent(category_id)}`);
                    if (data.success) setBrands(data.data || []); else message.error('Gagal ambil brand');
                } catch (_) { message.error('Koneksi gagal'); }
                finally { setProdLoading(false); }
            };
            const loadGroups = async (category_id, brand_id) => {
                if (!category_id || !brand_id) return;
                setProdLoading(true);
                try {
                    const data = await getJSON(`/api/product/groups?category_id=${encodeURIComponent(category_id)}&brand_id=${encodeURIComponent(brand_id)}`);
                    if (data.success) setGroups(data.data || []); else message.error('Gagal ambil grup');
                } catch (_) { message.error('Koneksi gagal'); }
                finally { setProdLoading(false); }
            };
            const loadVariations = async (group_id) => {
                if (!group_id) return;
                setProdLoading(true);
                try {
                    const data = await getJSON(`/api/product/variation-masters?group_id=${encodeURIComponent(group_id)}`);
                    if (data.success) setVariations(data.data || []); else message.error('Gagal ambil variasi');
                } catch (_) { message.error('Koneksi gagal'); }
                finally { setProdLoading(false); }
            };

            // On-demand loading: user triggers fetch with buttons.
            // Clear dependent data when upstream selection changes.
            useEffect(() => { setBrands([]); setBrandId(undefined); setGroups([]); setGroupId(undefined); setVariations([]); }, [catId]);
            useEffect(() => { setGroups([]); setGroupId(undefined); setVariations([]); }, [brandId]);
            useEffect(() => { setVariations([]); }, [groupId]);

            return (
                <div className="container">
                    <div className="panel">
                        <Tabs
                          activeKey={activeTab}
                          onChange={setActiveTab}
                          items={[
                            {
                              key: 'control',
                              label: 'Control',
                              children: (
                                <div>
                                    {controlsEnabled ? (
                                        <Button
                                            type={running ? 'primary' : 'primary'}
                                            danger={running}
                                            size="large"
                                            className="big-button"
                                            data-testid="toggle-service"
                                            onClick={toggle}
                                            loading={loading}
                                        >
                                            {running ? 'Stop App' : 'Start App'}
                                        </Button>
                                    ) : (
                                        <Button type="primary" size="large" className="big-button" disabled>
                                            Running on Hosting
                                        </Button>
                                    )}
                                    <div className="hint">
                                        <Text type="secondary">
                                            {running ? `Webhook: ${urls.webhook_url}` : 'Service stopped'}
                                        </Text>
                                    </div>
                                </div>
                              )
                            },
                            {
                              key: 'report',
                              label: 'Laporan',
                              children: (
                                <div>
                                    <Space direction="vertical" size="large" style={{ width: '100%' }}>
                                        <Space>
                                            <Radio.Group value={source} onChange={(e) => setSource(e.target.value)}>
                                                <Radio.Button value="transactions">Transaksi</Radio.Button>
                                                <Radio.Button value="balance">Balance</Radio.Button>
                                            </Radio.Group>
                                            <DatePicker.RangePicker
                                                allowClear={false}
                                                value={range}
                                                onChange={(v) => setRange(v)}
                                                format="YYYY-MM-DD"
                                            />
                                            <Button type="primary" onClick={fetchSummary} loading={summaryLoading} data-testid="fetch-summary">
                                                Hitung
                                            </Button>
                                        </Space>
                                        <Space size="large" wrap>
                                            <Card bordered style={{ minWidth: 220 }}>
                                                <Statistic title="Pendapatan" prefix="Rp" value={summary.pendapatan} precision={0} />
                                            </Card>
                                            <Card bordered style={{ minWidth: 220 }}>
                                                <Statistic title="Potongan" prefix="Rp" value={summary.potongan} precision={0} />
                                            </Card>
                                            <Card bordered style={{ minWidth: 220 }}>
                                                <Statistic title="Laba Bersih" prefix="Rp" value={summary.laba_bersih} precision={0} />
                                            </Card>
                                        </Space>
                                    </Space>
                                </div>
                                                            )
                                                        },
                                                        {
                                                            key: 'produk',
                                                            label: 'Produk',
                                                            children: (
                                                                <div>
                                                                    <Space direction="vertical" size="large" style={{ width: '100%', textAlign: 'left' }}>
                                                                        <Space wrap>
                                                                            <div>
                                                                                <Text strong>Kategori</Text>
                                                                                <Space>
                                                                                    <Select
                                                                                        style={{ minWidth: 260 }}
                                                                                        placeholder="Pilih kategori"
                                                                                        value={catId}
                                                                                        onChange={setCatId}
                                                                                        loading={prodLoading}
                                                                                        options={(categories || []).map(c => ({ label: c.name, value: c.id }))}
                                                                                        showSearch
                                                                                        optionFilterProp="label"
                                                                                    />
                                                                                    <Button onClick={loadCategories} loading={prodLoading}>Muat Kategori</Button>
                                                                                </Space>
                                                                            </div>
                                                                            <div>
                                                                                <Text strong>Brand</Text>
                                                                                <Space>
                                                                                    <Select
                                                                                        style={{ minWidth: 260 }}
                                                                                        placeholder="Pilih brand"
                                                                                        value={brandId}
                                                                                        onChange={setBrandId}
                                                                                        disabled={!catId}
                                                                                        loading={prodLoading}
                                                                                        options={(brands || []).map(b => ({ label: b.name, value: b.id }))}
                                                                                        showSearch
                                                                                        optionFilterProp="label"
                                                                                    />
                                                                                    <Button onClick={() => loadBrands(catId)} disabled={!catId} loading={prodLoading}>Muat Brand</Button>
                                                                                </Space>
                                                                            </div>
                                                                            <div>
                                                                                <Text strong>Group</Text>
                                                                                <Space>
                                                                                    <Select
                                                                                        style={{ minWidth: 260 }}
                                                                                        placeholder="Pilih group"
                                                                                        value={groupId}
                                                                                        onChange={setGroupId}
                                                                                        disabled={!brandId}
                                                                                        loading={prodLoading}
                                                                                        options={(groups || []).map(g => ({ label: g.name, value: g.id }))}
                                                                                        showSearch
                                                                                        optionFilterProp="label"
                                                                                    />
                                                                                    <Button onClick={() => loadGroups(catId, brandId)} disabled={!brandId} loading={prodLoading}>Muat Group</Button>
                                                                                </Space>
                                                                            </div>
                                                                        </Space>
                                                                        <Divider style={{ margin: '8px 0' }} />
                                                                        <div>
                                                                            <Text type="secondary">Variation Masters</Text>
                                                                            <div style={{ marginTop: 8 }}>
                                                                                <Space style={{ marginBottom: 8 }}>
                                                                                    <Button type="primary" onClick={() => loadVariations(groupId)} disabled={!groupId} loading={prodLoading}>Muat Variasi</Button>
                                                                                </Space>
                                                                                {prodLoading && variations.length === 0 ? (<Spin />) : (
                                                                                    <Table
                                                                                        dataSource={(variations || []).map((v, idx) => ({ key: v.id || idx, ...v }))}
                                                                                        size="small"
                                                                                        pagination={{ pageSize: 10 }}
                                                                                        columns={[
                                                                                            { title: 'ID', dataIndex: 'id', key: 'id', width: 320 },
                                                                                            { title: 'Nama', dataIndex: 'name', key: 'name' },
                                                                                            { title: 'Wajib', dataIndex: 'is_required', key: 'is_required', render: (v) => v ? 'Ya' : 'Tidak', width: 100 },
                                                                                            { title: 'Aktif', dataIndex: 'is_active', key: 'is_active', render: (v) => v ? 'Ya' : 'Tidak', width: 100 },
                                                                                        ]}
                                                                                    />
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    </Space>
                                                                </div>
                                                            )
                                                        },
                            {
                              key: 'log',
                              label: 'Log API',
                              children: <ApiLogPanel active={activeTab === 'log'} />
                            }
                          ]}
                        />
                    </div>
                </div>
            );
        }

        const mountNode = document.getElementById('root');
        if (ReactDOM.createRoot) {
            ReactDOM.createRoot(mountNode).render(<App />);
        } else {
            ReactDOM.render(<App />, mountNode);
        }
    </script>
</body>
</html>
