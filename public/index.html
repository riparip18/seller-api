<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Seller API Control</title>
    
    <!-- Ant Design CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/antd.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Day.js required by Ant Design UMD -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <!-- Ant Design JS -->
    <script src="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/antd.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0,0,0,0.1);
        }
        .big-button {
            height: 72px;
            min-width: 280px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
        }
        .hint {
            margin-top: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react" data-plugins="proposal-optional-chaining">
        const { useState, useEffect } = React;
        const { Button, Typography, message } = antd;
        const { Text } = Typography;

        function App() {
            const [running, setRunning] = useState(false);
            const [loading, setLoading] = useState(false);
            const [urls, setUrls] = useState({ webhook_url: '', status_url: '' });
            const [controlsEnabled, setControlsEnabled] = useState(false);

            const fetchStatus = async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    if (data.success) {
                        setRunning(Boolean(data.data?.tunnel_running));
                        setControlsEnabled(Boolean(data.data?.controls_enabled));
                        setUrls({
                            webhook_url: data.data?.webhook_url || '',
                            status_url: data.data?.status_url || ''
                        });
                    }
                } catch (_) {
                    message.error('Gagal mengambil status');
                }
            };

            const toggle = async () => {
                setLoading(true);
                try {
                    const endpoint = running ? '/api/stop' : '/api/start';
                    const res = await fetch(endpoint, { method: 'POST' });
                    const data = await res.json();
                    if (!data.success) {
                        message.error(data.message || 'Aksi gagal');
                    }
                } catch (_) {
                    message.error('Koneksi gagal');
                } finally {
                    await fetchStatus();
                    setLoading(false);
                }
            };

            useEffect(() => { fetchStatus(); }, []);

            return (
                <div className="container">
                    <div className="panel">
                        {controlsEnabled ? (
                            <Button
                                type={running ? 'primary' : 'primary'}
                                danger={running}
                                size="large"
                                className="big-button"
                                data-testid="toggle-service"
                                onClick={toggle}
                                loading={loading}
                            >
                                {running ? 'Stop App' : 'Start App'}
                            </Button>
                        ) : (
                            <Button type="primary" size="large" className="big-button" disabled>
                                Running on Hosting
                            </Button>
                        )}
                        <div className="hint">
                            <Text type="secondary">
                                {running ? `Webhook: ${urls.webhook_url}` : 'Service stopped'}
                            </Text>
                        </div>
                    </div>
                </div>
            );
        }

        const mountNode = document.getElementById('root');
        if (ReactDOM.createRoot) {
            ReactDOM.createRoot(mountNode).render(<App />);
        } else {
            ReactDOM.render(<App />, mountNode);
        }
    </script>
</body>
</html>
