<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Seller API Control</title>
    
    <!-- Ant Design CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/antd.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Day.js required by Ant Design UMD -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <!-- Ant Design JS -->
    <script src="https://cdn.jsdelivr.net/npm/antd@5.11.0/dist/antd.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0,0,0,0.1);
        }
        .big-button {
            height: 72px;
            min-width: 280px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
        }
        .hint {
            margin-top: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react" data-plugins="proposal-optional-chaining">
        const { useState, useEffect } = React;
        const { Button, Typography, message, DatePicker, Card, Statistic, Space, Tabs, Radio } = antd;
        const { Text, Title } = Typography;

        function App() {
            const [running, setRunning] = useState(false);
            const [loading, setLoading] = useState(false);
            const [urls, setUrls] = useState({ webhook_url: '', status_url: '' });
            const [controlsEnabled, setControlsEnabled] = useState(false);
            const [summaryLoading, setSummaryLoading] = useState(false);
            const [summary, setSummary] = useState({ pendapatan: 0, potongan: 0, laba_bersih: 0 });
            const [range, setRange] = useState([dayjs().startOf('month'), dayjs().endOf('month')]);
            const [source, setSource] = useState('transactions'); // 'transactions' | 'balance'

            const fetchStatus = async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();
                    if (data.success) {
                        setRunning(Boolean(data.data?.tunnel_running));
                        setControlsEnabled(Boolean(data.data?.controls_enabled));
                        setUrls({
                            webhook_url: data.data?.webhook_url || '',
                            status_url: data.data?.status_url || ''
                        });
                    }
                } catch (_) {
                    message.error('Gagal mengambil status');
                }
            };

            const toggle = async () => {
                setLoading(true);
                try {
                    const endpoint = running ? '/api/stop' : '/api/start';
                    const res = await fetch(endpoint, { method: 'POST' });
                    const data = await res.json();
                    if (!data.success) {
                        message.error(data.message || 'Aksi gagal');
                    }
                } catch (_) {
                    message.error('Koneksi gagal');
                } finally {
                    await fetchStatus();
                    setLoading(false);
                }
            };

            useEffect(() => { fetchStatus(); }, []);

            const fetchSummary = async () => {
                setSummaryLoading(true);
                try {
                    let endpoint = '/api/transactions/summary';
                    const [start, end] = range || [];
                    const params = new URLSearchParams();
                    if (source === 'transactions') {
                        if (start) params.set('date_start', start.format('YYYY-MM-DD'));
                        if (end) params.set('date_end', end.format('YYYY-MM-DD'));
                    } else {
                        // Balance histories doesn't support date range directly; allow search keyword if needed
                    }
                    if (source === 'balance') endpoint = '/api/balance/summary';
                    const res = await fetch(`${endpoint}?${params.toString()}`);
                    const data = await res.json();
                    if (data.success) {
                        setSummary(data.data || { pendapatan: 0, potongan: 0, laba_bersih: 0 });
                    } else {
                        message.error('Gagal mengambil ringkasan');
                    }
                } catch (_) {
                    message.error('Koneksi gagal');
                } finally {
                    setSummaryLoading(false);
                }
            };

            return (
                <div className="container">
                    <div className="panel">
                        <Tabs
                          defaultActiveKey="control"
                          items={[
                            {
                              key: 'control',
                              label: 'Control',
                              children: (
                                <div>
                                    {controlsEnabled ? (
                                        <Button
                                            type={running ? 'primary' : 'primary'}
                                            danger={running}
                                            size="large"
                                            className="big-button"
                                            data-testid="toggle-service"
                                            onClick={toggle}
                                            loading={loading}
                                        >
                                            {running ? 'Stop App' : 'Start App'}
                                        </Button>
                                    ) : (
                                        <Button type="primary" size="large" className="big-button" disabled>
                                            Running on Hosting
                                        </Button>
                                    )}
                                    <div className="hint">
                                        <Text type="secondary">
                                            {running ? `Webhook: ${urls.webhook_url}` : 'Service stopped'}
                                        </Text>
                                    </div>
                                </div>
                              )
                            },
                            {
                              key: 'report',
                              label: 'Laporan',
                              children: (
                                <div>
                                    <Space direction="vertical" size="large" style={{ width: '100%' }}>
                                        <Space>
                                            <Radio.Group value={source} onChange={(e) => setSource(e.target.value)}>
                                                <Radio.Button value="transactions">Transaksi</Radio.Button>
                                                <Radio.Button value="balance">Balance</Radio.Button>
                                            </Radio.Group>
                                            <DatePicker.RangePicker
                                                allowClear={false}
                                                value={range}
                                                onChange={(v) => setRange(v)}
                                                format="YYYY-MM-DD"
                                            />
                                            <Button type="primary" onClick={fetchSummary} loading={summaryLoading} data-testid="fetch-summary">
                                                Hitung
                                            </Button>
                                        </Space>
                                        <Space size="large" wrap>
                                            <Card bordered style={{ minWidth: 220 }}>
                                                <Statistic title="Pendapatan" prefix="Rp" value={summary.pendapatan} precision={0} />
                                            </Card>
                                            <Card bordered style={{ minWidth: 220 }}>
                                                <Statistic title="Potongan" prefix="Rp" value={summary.potongan} precision={0} />
                                            </Card>
                                            <Card bordered style={{ minWidth: 220 }}>
                                                <Statistic title="Laba Bersih" prefix="Rp" value={summary.laba_bersih} precision={0} />
                                            </Card>
                                        </Space>
                                    </Space>
                                </div>
                              )
                            }
                          ]}
                        />
                    </div>
                </div>
            );
        }

        const mountNode = document.getElementById('root');
        if (ReactDOM.createRoot) {
            ReactDOM.createRoot(mountNode).render(<App />);
        } else {
            ReactDOM.render(<App />, mountNode);
        }
    </script>
</body>
</html>
