[build]
  publish = "public"
  command = ""
  functions = "netlify/functions"

# Redirect API calls to Netlify Functions
[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/api-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/start"
  to = "/.netlify/functions/api-start"
  status = 200
  force = true

[[redirects]]
  from = "/api/stop"
  to = "/.netlify/functions/api-stop"
  status = 200
  force = true

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/transactions"
  to = "/.netlify/functions/transactions"
  status = 200
  force = true

[[redirects]]
  from = "/api/transactions/summary"
  to = "/.netlify/functions/transactions-summary"
  status = 200
  force = true

[[redirects]]
  from = "/api/balance"
  to = "/.netlify/functions/balance"
  status = 200
  force = true

[[redirects]]
  from = "/api/balance/histories"
  to = "/.netlify/functions/balance-histories"
  status = 200
  force = true

[[redirects]]
  from = "/api/balance/summary"
  to = "/.netlify/functions/balance-summary"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
